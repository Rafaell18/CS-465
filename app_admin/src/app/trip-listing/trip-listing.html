<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Travlr Admin</h2>

    @if (authenticationService.isLoggedIn()) {
      <a routerLink="/add-trip" class="btn btn-primary">
        Add Trip
      </a>
    }
  </div>

  <div class="row">
    @for (trip of trips; track trip.code) {
      <app-trip-card
        [trip]="trip"
        class="card-deck mt-2">
      </app-trip-card>
    }
  </div>
</div>
