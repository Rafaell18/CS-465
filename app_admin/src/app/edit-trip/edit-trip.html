<div class="container mt-4">
  <h2>Edit Trip</h2>

  <form (ngSubmit)="updateTrip()">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        class="form-control"
        [(ngModel)]="trip.code"
        name="code"
        readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        class="form-control"
        [(ngModel)]="trip.name"
        name="name">
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        class="form-control"
        [(ngModel)]="trip.resort"
        name="resort">
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        class="form-control"
        [(ngModel)]="trip.length"
        name="length">
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        [(ngModel)]="trip.start"
        name="start">
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="trip.perPerson"
        name="perPerson">
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        class="form-control"
        [(ngModel)]="trip.image"
        name="image">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        [(ngModel)]="trip.description"
        name="description"
        rows="4">
      </textarea>
    </div>

    <button class="btn btn-primary me-2" type="submit">
      Update Trip
    </button>

    <a routerLink="/" class="btn btn-secondary">
      Cancel
    </a>

  </form>
</div>
