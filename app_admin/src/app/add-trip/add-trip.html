<div class="container mt-4">
  <h2>Add Trip</h2>

  <form (ngSubmit)="addTrip()">
    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        class="form-control"
        [(ngModel)]="newTrip.code"
        name="code"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        class="form-control"
        [(ngModel)]="newTrip.name"
        name="name"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        class="form-control"
        [(ngModel)]="newTrip.resort"
        name="resort"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        class="form-control"
        [(ngModel)]="newTrip.length"
        name="length"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        [(ngModel)]="newTrip.start"
        name="start"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="newTrip.perPerson"
        name="perPerson"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        class="form-control"
        [(ngModel)]="newTrip.image"
        name="image"
        placeholder="reef1.jpg"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        [(ngModel)]="newTrip.description"
        name="description"
        rows="4"
        required>
      </textarea>
    </div>

    <button class="btn btn-primary me-2" type="submit">
      Save Trip
    </button>

    <a routerLink="/" class="btn btn-secondary">
      Cancel
    </a>
  </form>
</div>
